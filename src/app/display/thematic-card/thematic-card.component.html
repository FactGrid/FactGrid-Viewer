@if (showHeader || title || hasProjectedHeader || collapsible) {
  <header class="card-header" [class.has-custom]="hasProjectedHeader">
    @if (hasProjectedHeader) {
      <ng-content select="[card-header]"></ng-content>
    } @else {
      @if (title || icon) {
        <div class="title">
          @if (icon) {
            <mat-icon class="title-icon">{{ icon }}</mat-icon>
          }
          @if (title) {
            <span class="title-text">{{ title }}</span>
          }
        </div>
      }
    }

    <!-- Always show header actions (collapse button / projected actions) -->
    <div class="header-actions">
      @if (collapsible) {
        <button mat-button (click)="toggle()" class="collapse-btn" [attr.aria-expanded]="!isCollapsed">
          <mat-icon>{{ isCollapsed ? 'expand_more' : 'expand_less' }}</mat-icon>
          <span>{{ isCollapsed ? 'Afficher' : 'Masquer' }}</span>
        </button>
      }
      <ng-content select="[card-actions]"></ng-content>
    </div>
  </header>
}
<section class="card-body" [class.collapsed]="isCollapsed">
  @if (!loading) {
    @if (!isCollapsed) {
      <div [@collapseExpand] class="body-inner">
        <ng-content></ng-content>
      </div>
    }
  }
  <ng-template #loaderTpl>
    <div class="skeleton" aria-label="Chargement" role="status">
      <div class="line w60"></div>
      <div class="line w40"></div>
      <div class="line w80"></div>
    </div>
  </ng-template>
</section>
