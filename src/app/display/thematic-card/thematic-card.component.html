<!-- include icon in outer guard so icon-only cards still render a header -->
@if (showHeader || title || hasProjectedHeader || collapsible || icon) {
  <header class="card-header" [class.has-custom]="hasProjectedHeader">
    @if (hasProjectedHeader) {
      <ng-content select="[card-header]"></ng-content>
    } @else {
      @if (title || icon) {
        <div class="title">
          @if (icon) {
            <mat-icon class="title-icon">{{ icon }}</mat-icon>
          }
          @if (title) {
            <span class="title-text typo-thematic-card-title">{{ title }}</span>
          }
        </div>
      }
    }

    <!-- Always show header actions (collapse button / projected actions) -->
    <div class="header-actions">
      @if (collapsible) {
        <button
          mat-button
          (click)="toggle()"
          class="collapse-btn"
          [attr.aria-expanded]="!isCollapsed"
          [attr.aria-label]="isCollapsed ? 'Afficher' : 'Masquer'"
          [matTooltip]="isCollapsed ? 'Afficher' : 'Masquer'"
          matTooltipPosition="above"
        >
          <mat-icon>{{ isCollapsed ? 'expand_more' : 'expand_less' }}</mat-icon>
          <span class="collapse-text">{{ isCollapsed ? 'Afficher' : 'Masquer' }}</span>
        </button>
      }
      <ng-content select="[card-actions]"></ng-content>
    </div>
  </header>
}
<section class="card-body" [class.collapsed]="isCollapsed">
  @if (!loading) {
    <!-- keep projected content in the DOM even when collapsed so parent
         components can query/inject into projected insertion points (e.g.
         #itemInfoHost). We still visually hide it when collapsed. -->
    <div class="body-inner" [class.content-hidden]="isCollapsed" [attr.aria-hidden]="isCollapsed">
      <ng-content></ng-content>
    </div>
  }
  <ng-template #loaderTpl>
    <div class="skeleton" aria-label="Chargement" role="status">
      <div class="line w60"></div>
      <div class="line w40"></div>
      <div class="line w80"></div>
    </div>
  </ng-template>
</section>
